# Native build on the Linux CI runner. A cross file even here, so every target
# goes through one code path and linux is not the special case that skips it.
[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'

# nasm named here or meson never looks for it.
#
# A cross build resolves every compiler from this file, so an nasm that is
# installed and on PATH is still "not found for the host machine" and libass
# turns the missing assembler into a hard failure rather than a fallback.
nasm = 'nasm'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
