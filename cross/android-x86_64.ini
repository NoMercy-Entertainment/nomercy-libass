# NDK clang, API 29 — the minSdk the video library declares. Built here rather
# than taken from io.github.peerless2012.ass, so the phone and the desktop run
# the same libass rather than two builds that agree until they do not.
[binaries]
c = '$NDK_BIN/x86_64-linux-android29-clang'
cpp = '$NDK_BIN/x86_64-linux-android29-clang++'
ar = '$NDK_BIN/llvm-ar'
strip = '$NDK_BIN/llvm-strip'
pkg-config = 'pkg-config'

# nasm named here or meson never looks for it.
#
# A cross build resolves every compiler from this file, so an nasm that is
# installed and on PATH is still "not found for the host machine" and libass
# turns the missing assembler into a hard failure rather than a fallback.
nasm = 'nasm'

[host_machine]
system = 'android'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
