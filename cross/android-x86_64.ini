# NDK clang, API 29 — the minSdk the video library declares. Built here rather
# than taken from io.github.peerless2012.ass, so the phone and the desktop run
# the same libass rather than two builds that agree until they do not.
[binaries]
c = '$NDK_BIN/x86_64-linux-android29-clang'
cpp = '$NDK_BIN/x86_64-linux-android29-clang++'
ar = '$NDK_BIN/llvm-ar'
strip = '$NDK_BIN/llvm-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'android'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

# 16 KB pages, stated rather than left to the NDK: r27 links for 4 KB by
# default, a 16 KB-page device cannot load that, and Google Play refuses the
# bundle. scripts/check-page-size.sh fails the build on anything below 16384.
[built-in options]
c_link_args = ['-Wl,-z,max-page-size=16384']
cpp_link_args = ['-Wl,-z,max-page-size=16384']
