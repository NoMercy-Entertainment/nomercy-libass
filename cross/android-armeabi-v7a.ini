# NDK clang, API 29 — the minSdk the video library declares. Built here rather
# than taken from io.github.peerless2012.ass, so the phone and the desktop run
# the same libass rather than two builds that agree until they do not.
[binaries]
c = '$NDK_BIN/armv7a-linux-androideabi29-clang'
cpp = '$NDK_BIN/armv7a-linux-androideabi29-clang++'
ar = '$NDK_BIN/llvm-ar'
strip = '$NDK_BIN/llvm-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'android'
cpu_family = 'arm'
cpu = 'armv7a'
endian = 'little'
