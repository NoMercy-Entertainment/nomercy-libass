# mingw-w64 from the Linux runner, so Windows is built by CI rather than by
# whoever happens to have a toolchain. The desktop had NO libass at all before
# this repo — `win32-x86-64/ass.dll` not found — because the only payload was
# Apple's.
[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
# The host's pkg-config, deliberately.
#
# mingw-w64 ships no pkg-config wrapper on the runner, and naming one meson
# cannot find makes it give up on pkg-config entirely — harfbuzz then reports
# the missing FreeType it just built. PKG_CONFIG_LIBDIR points at this target's
# prefix and nothing else, so a host library still cannot leak in.
pkg-config = 'pkg-config'
windres = 'x86_64-w64-mingw32-windres'

# nasm named here or meson never looks for it.
#
# A cross build resolves every compiler from this file, so an nasm that is
# installed and on PATH is still "not found for the host machine" and libass
# turns the missing assembler into a hard failure rather than a fallback.
nasm = 'nasm'

[built-in options]
# The gcc runtime goes INSIDE the DLL.
#
# Without this the payload imports libgcc_s_seh-1.dll and nothing else outside
# the Windows system set, so it loads on a machine that has mpv or VLC installed
# — those carry a copy — and fails everywhere else with "the specified module
# could not be found", which names no module. Measured with objdump on the
# published 0.17.5 payload, and reproduced on the CI runner, whose service
# account has no such copy: eight desktop gates red, and every one of them
# passing on a developer's laptop.
#
# Static rather than shipped beside it: one file is the whole promise of this
# payload, and a second DLL is a second thing to get onto the search path.
c_link_args = ['-static-libgcc']
cpp_link_args = ['-static-libgcc', '-static-libstdc++']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
