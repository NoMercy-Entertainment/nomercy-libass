# Emscripten. This is what replaces SubtitlesOctopus: the web stops carrying a
# vendored JavaScript port of libass and links the same binary every other
# surface does.
[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'
pkg-config = 'pkg-config'
exe_wrapper = 'node'

[built-in options]
c_args = ['-O3', '-fPIC']
cpp_args = ['-O3', '-fPIC']

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
