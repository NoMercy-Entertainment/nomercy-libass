name: release

# Every surface's libass, built from one set of pinned sources, in one run.
#
# The reason this is a matrix in CI rather than a script somebody runs: a
# library whose features depend on what the builder happened to have installed
# behaves differently for every user. Before this repo the desktop had no libass
# at all, Android took a third-party binding, Apple took a prebuilt archive and
# the web carried a vendored JavaScript port — four origins, four ways to fall
# short.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86-64
            runner: '["self-hosted","Linux","X64","beast-unit"]'
            platform: linux-x64
          - target: windows-x86-64
            runner: '["self-hosted","Linux","X64","beast-unit"]'
            packages: mingw-w64
            platform: windows-x64
          - target: android-arm64-v8a
            runner: '["self-hosted","Linux","X64","beast-unit"]'
            ndk: true
            platform: android-arm64-v8a
          - target: android-armeabi-v7a
            runner: '["self-hosted","Linux","X64","beast-unit"]'
            ndk: true
            platform: android-armeabi-v7a
          - target: android-x86_64
            runner: '["self-hosted","Linux","X64","beast-unit"]'
            ndk: true
            platform: android-x86_64
          - target: wasm
            runner: '["self-hosted","Linux","X64","beast-unit"]'
            emsdk: true
            platform: wasm
          - target: apple
            runner: '["self-hosted","macOS","ARM64","mac-mini"]'
            apple: true
            platform: apple
    # A label set rather than an image name, so the matrix has to hand over an
    # array - a bare string can only name one label.
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y meson ninja-build nasm ${{ matrix.packages }} || \
            brew install meson ninja nasm

      - name: emsdk
        if: matrix.emsdk
        uses: mymindstorm/setup-emsdk@v14

      - name: ndk
        if: matrix.ndk
        run: |
          echo "NDK_BIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: fetch sources
        run: bash scripts/fetch.sh

      # Apple is an XCFramework of several slices rather than one library, so it
      # has its own script. Everything else is the same four meson builds.
      - name: build
        run: |
          if [ "${{ matrix.target }}" = "apple" ]; then
            bash scripts/build-apple.sh
          else
            bash scripts/build-target.sh ${{ matrix.target }}
          fi

      # A browser cannot load a static library. This links ours into the worker
      # the web player already has a wrapper for, which is what retires the
      # vendored SubtitlesOctopus build.
      - name: wasm worker
        if: matrix.target == 'wasm'
        run: bash scripts/build-wasm-worker.sh

      # Packaged as the archive nomercy-player-core-kmp's NativeArchives already
      # resolves, so the desktop picks our build up with no code change at all.
      # Every target, not only the two that had a platform id. Android, Apple
      # and wasm produced real payloads and shipped none of them, because this
      # step was gated on a field only linux and windows carried.
      - name: package
        run: bash scripts/package.sh ${{ matrix.target }} ${{ matrix.platform }}

      # The archive only. Uploading the prefix tree as well is what made the
      # release collide on the first header two targets had in common.
      - uses: actions/upload-artifact@v4
        with:
          name: libass-${{ matrix.target }}
          path: build/dist/*.tar.gz

  # One release carrying every surface, so a consumer cannot pick up a desktop
  # build from one version and an Android build from another.
  # Tags only. A workflow_dispatch has no ref to release against, and the
  # release action says so at the end of a full seven-job matrix: "GitHub
  # Releases requires a tag". Dispatch stays useful for checking the matrix
  # builds; a tag is what ships.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      - uses: actions/checkout@v4

      # The tag and the archives have to name the same payload.
      #
      # A consumer resolves `libass-<version>-<platform>.tar.gz` under the tag
      # `v<version>`; the two are built from different places -- the tag from
      # whoever pushed it, the names from versions.env -- and a mismatch
      # publishes a release whose every asset 404s at the URL anything actually
      # asks for. Cheaper to fail here than to find out from a desktop that
      # says libass is not installed.
      - name: The tag names the payload the archives carry
        run: |
          set -e
          . ./versions.env
          expected="v$LIBASS_PAYLOAD_VERSION"
          actual="${GITHUB_REF_NAME}"
          if [ "$expected" != "$actual" ]; then
            echo "tag $actual does not match versions.env, which builds $expected" >&2
            exit 1
          fi
          echo "tag and payload agree: $actual"

      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: 'libass-*/*.tar.gz'
          fail_on_unmatched_files: true
