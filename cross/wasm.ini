# Emscripten. This is what replaces SubtitlesOctopus: the web stops carrying a
# vendored JavaScript port of libass and links the same binary every other
# surface does.
[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'
pkg-config = 'pkg-config'
exe_wrapper = 'node'

# Declared, or meson tries to run what emcc produced and reports it as "not
# runnable" — an emscripten build emits JavaScript plus a .wasm, which no host
# can execute directly. exe_wrapper above is how it is run; this is what tells
# meson to use it.
[properties]
needs_exe_wrapper = true

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
